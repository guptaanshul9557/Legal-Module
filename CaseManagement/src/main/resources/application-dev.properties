server.port = 8090

# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/legal_module
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# CONNECTION POOL (HIKARI)
# ===============================
#spring.datasource.hikari.pool-name=LegalModuleHikariCP
#spring.datasource.hikari.maximum-pool-size=10
#spring.datasource.hikari.minimum-idle=2
#spring.datasource.hikari.idle-timeout=30000
#spring.datasource.hikari.max-lifetime=1800000
#spring.datasource.hikari.connection-timeout=20000

# ===============================
# TRANSACTION
# ===============================
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# ===============================
# KAFKA
# ===============================
# Kafka Bootstrap Servers (Kafka broker addresses)
spring.kafka.bootstrap-servers=localhost:9092

#Topic
kafka.topic.case-filing=case-filing-topic

# Producer specific configurations
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


# ===============================
# FILE STORAGE
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
file.storage.local.base-path=C:/legal/uploads

